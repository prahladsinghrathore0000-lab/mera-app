name: Build APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create .env file from Secrets
        run: |
          echo "GEMINI_API_KEY_1=${{ secrets.GEMINI_API_KEY_1 }}" >> .env
          echo "GEMINI_API_KEY_2=${{ secrets.GEMINI_API_KEY_2 }}" >> .env
          echo "GEMINI_API_KEY_3=${{ secrets.GEMINI_API_KEY_3 }}" >> .env
          echo "GEMINI_API_KEY_4=${{ secrets.GEMINI_API_KEY_4 }}" >> .env
          echo "GEMINI_API_KEY_5=${{ secrets.GEMINI_API_KEY_5 }}" >> .env
          echo "GH_SYNC_TOKEN=${{ secrets.GH_SYNC_TOKEN }}" >> .env
          cp .env app/.env

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: gradle assembleDebug

      - name: Build Debug AAB
        env:
            GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
            GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
            GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
            GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
            GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
            GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: gradle bundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
