name: Make Pakka Keystore
on: workflow_dispatch
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my-release-key.keystore -storepass TestSeries@123 -alias mykey -keypass TestSeries@123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TestSeries,O=TestSeries,C=IN"
          ls -lh
      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: my-pakka-keystore
          path: my-release-key.keystore
